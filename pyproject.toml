[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "cvlac-json"
dynamic = ["version"]
description = "Turn a researcher's public CvLAC page (Minciencias, Colombia) into one JSON document, with Scienti and ROR identifiers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Diego Restrepo", email = "restrepo@udea.edu.co" }]
keywords = ["cvlac", "scienti", "minciencias", "colombia", "bibliometrics", "cris", "impactu", "ror"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = []   # standard library only

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2", "twine>=5"]

[project.scripts]
cvlac-json = "cvlac_json.cli:main"

[project.urls]
Homepage = "https://github.com/restrepo/cvlac-json"
Repository = "https://github.com/restrepo/cvlac-json"
Issues = "https://github.com/restrepo/cvlac-json/issues"
Changelog = "https://github.com/restrepo/cvlac-json/blob/main/CHANGELOG.md"

# Version from the git tag (v0.1.0 -> 0.1.0); commits after a tag get 0.1.1.devN
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"   # PyPI and TestPyPI reject local versions (+g1234abc)

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/cvlac_json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["cvlac_json"]
branch = true

[tool.ruff]
line-length = 130
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E401",    # several stdlib imports per line, kept from the original scripts
    "E731",    # small lambdas assigned to names
    "SIM108",  # ternaries are not always clearer
    "RUF001", "RUF002", "RUF003",  # Spanish text with accents and typographic quotes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
